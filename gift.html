<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      body {
        background-color: black;
      }
      svg {
        border: 1px solid green;
      }
    </style>
  </head>

  <body>
    <svg height="200" width="200" viewBox="-100 -100 200 200">
      <path
        d="
      M 60 -40
      C -200 100
      200 100
      -60 -40"
        stroke="lime"
        stroke-width="20"
        stroke-linecap="round"
        fill="none"
      />
    </svg>
    <svg height="200" width="200" viewBox="-100 -100 200 200">
      <circle r="25" cx="0" cy="-60" fill="lime" stroke="lime" stroke-width="15" />
      <path
        d="
        M -70 70
        L 70 70
        C 70 -30
        -70 -30
        -70 70
        "
        stroke="lime"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="lime"
      />
    </svg>
    <svg height="200" width="200" viewBox="-100 -100 200 200">
      <circle r="25" cx="0" cy="-60" fill="none" stroke="lime" stroke-width="15" />
      <path
        d="
            M 70 70
            C 70 -30
            -70 -30
            -70 70
            Z"
        stroke="lime"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
    <svg height="200" width="200" viewBox="-100 -100 200 200">
      <path
        d="M 0 -60
        C 160 100 -160 100 0 -60
        Z"
        stroke="royalblue"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
    <svg height="200" width="200" viewBox="-100 -100 200 200">
      <circle r="25" cx="0" cy="-60" fill="lime" stroke="lime" stroke-width="15" />
      <path
        d="
            M -70 70
            L 70 70
            C 70 -30
            -70 -30
            -70 70
            "
        stroke="lime"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="lime"
      />
    </svg>
  </body>
</html>
