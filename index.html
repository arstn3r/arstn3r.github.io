<!DOCTYPE html>
<html>
  <head>
    <style>
      /* http://meyerweb.com/eric/tools/css/reset/ 
         v2.0 | 20110126
         License: none (public domain)
      */

      html,
      body,
      div,
      span,
      applet,
      object,
      iframe,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      blockquote,
      pre,
      a,
      abbr,
      acronym,
      address,
      big,
      cite,
      code,
      del,
      dfn,
      em,
      img,
      ins,
      kbd,
      q,
      s,
      samp,
      small,
      strike,
      strong,
      sub,
      sup,
      tt,
      var,
      b,
      u,
      i,
      center,
      dl,
      dt,
      dd,
      ol,
      ul,
      li,
      fieldset,
      form,
      label,
      legend,
      table,
      caption,
      tbody,
      tfoot,
      thead,
      tr,
      th,
      td,
      article,
      aside,
      canvas,
      details,
      embed,
      figure,
      figcaption,
      footer,
      header,
      hgroup,
      menu,
      nav,
      output,
      ruby,
      section,
      summary,
      time,
      mark,
      audio,
      video {
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 100%;
        font: inherit;
        vertical-align: baseline;
      }
      /* HTML5 display-role reset for older browsers */
      article,
      aside,
      details,
      figcaption,
      figure,
      footer,
      header,
      hgroup,
      menu,
      nav,
      section {
        display: block;
      }
      body {
        line-height: 1;
      }
      ol,
      ul {
        list-style: none;
      }
      blockquote,
      q {
        quotes: none;
      }
      blockquote:before,
      blockquote:after,
      q:before,
      q:after {
        content: "";
        content: none;
      }
      table {
        border-collapse: collapse;
        border-spacing: 0;
      }

      body {
        position: relative;
        isolation: isolate;
        background: #1d2a24;
        height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -40px;
        background: url("bg.webp") center / cover no-repeat;
        filter: blur(12px);
        z-index: -1;
      } /* blur in CSS; negative inset hides the soft edges */
      h1 {
        background-color: rgba(0, 0, 0, 0.3);
        height: 40px;
        padding: 0 30px;
        margin: 0 0 5px 0;
        color: #dbd9af;
        font-family: sans-serif;
        font-size: 20px;
        display: flex;
        align-items: center;
      }
      h1 span{
        margin-left: 85%;
      }
      ul {
        margin: 10px 30px;
        color: #2c4249;
        font-weight: bold;
      }
      ul * {
        margin: 10px;
      }
      ul li span {
        font-weight: bold;
        color: #2c4249;
        text-decoration: none;
      }

      @supports ((background-clip: text) or (-webkit-background-clip: text)) {
        ul li a,
        ul {
          background: linear-gradient(47deg, #2c4249, #2c4249, #e4dfb2, #e4dfb2);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <h1>Coming soon.</h1>

    <ul>
      Some links for now:
      <li>
        <a href="./maze-race.html">
          <span>❯</span>
          An A.I. made game
        </a>
      </li>
      <li>
        <a href="https://t.me/arstn3r">
          <span>❯</span>
          Telegram profile
        </a>
      </li>
    </ul>
    <script>
      window.addEventListener("load", () => {
        const t = performance.getEntriesByType("navigation")[0];
        document.querySelector("body :first-child").innerHTML = `Coming soon <span>${Math.round(performance.now()/1000)}s</span>`;
      });
    </script>
  </body>
</html>
